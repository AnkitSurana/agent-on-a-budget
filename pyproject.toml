[project]
name = "agent-on-a-budget"
version = "0.1.0"
description = "An AI support agent that gets cheaper and faster by teaching a small ML model to do most of its work."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "openai>=3.0",
    "datasets>=3.0",
    "joblib>=1.4",
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
    "matplotlib>=3.8",
    "nbconvert>=7.10",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "scikit-learn>=1.5",
    "streamlit>=1.50",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false   # this is a project you run, not a library you install

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
